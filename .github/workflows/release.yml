name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: plugins/plan-reviewer
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Cross-compile + gzip
        run: make build-all
      - name: Commit binaries
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/plan-reviewer/bin/
          git diff --cached --quiet || git commit -m "chore: rebuild binaries for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
